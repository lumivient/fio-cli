[project]
name = "fio-cli"
version = "0.1.0"
description = "CLI wrapper on top of fio-sdk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fio-sdk @ git+https://github.com/lumivient/fio-sdk",
	"jmespath>=1.0.1",
	"typer>=0.16.0",
]

[project.scripts]
fio = "fio_cli.main:main"

[dependency-groups]
dev = [
	"pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
